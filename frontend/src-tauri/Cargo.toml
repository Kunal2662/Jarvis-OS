[package]
name = "app"
version = "0.1.0"
description = "JARVIS OS -- local-first AI Operating System desktop shell"
authors = ["JARVIS OS contributors"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
# Backs services/window/window-service.ts's cross-restart persistence
# (Task 14, Window Management foundation).
tauri-plugin-window-state = "2"
