[alembic]
# Milestone 3.1 — Alembic migrations for the SQLite schema, replacing
# `Base.metadata.create_all`-at-boot as the source of truth going forward.
# The actual URL is resolved at runtime in alembic/env.py from JARVIS
# Settings (JARVIS_DB_URL / .env), so this is left as a placeholder.
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
