repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: ["--fix"]
      # ruff-format intentionally omitted: it disagrees with black on
      # formatting in several files (confirmed live during the repository
      # stabilization pass -- `ruff format --check` flagged 6 files black
      # already considers correctly formatted), so running both on every
      # commit would fight each other. black is this project's canonical
      # formatter ([tool.black] in pyproject.toml); ruff is kept for
      # linting (--fix) only.

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.13

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        additional_dependencies:
          - "pydantic>=2.9"
          - "pydantic-settings>=2.6"
        args: ["--config-file=pyproject.toml"]
        files: ^src/
